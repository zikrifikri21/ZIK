<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ZIK</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* San Francisco: Apple's system font (only on macOS / where installed; its license forbids bundling it), Segoe UI otherwise */
  :root { --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "San Francisco", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .mascot-bulu .mb-bubble { font-family: var(--sf); }
  .mb-lyric { display: none !important; }   /* replaced by the scrolling stack below */

  /* lyric stack: current line centered, previous/next faded, scrolls up on each new line */
  /* current line sits in the middle of the 7.5em stack → pull the stack down so that line is ~20px above the head
     (head top ≈ 86% of the mascot's height); the faded next line dips behind the head, the mask hides it */
  .zl { position: absolute; left: 50%; bottom: calc(88% - 1.8em); width: 340px; height: 7.5em; margin-left: -170px;
        overflow: hidden; pointer-events: none; text-align: center; font: 700 var(--ls, 16px)/1.35 var(--sf);
        -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); transition: opacity .2s, margin-left .45s cubic-bezier(.2,.8,.2,1); }
  .zl .in { transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
  .zl p { margin: 0; padding: 4px 6px; opacity: 0; transform: scale(.88); transition: opacity .55s, transform .55s; }
  .zl span { background: rgba(16, 28, 60, .9); color: #fff; padding: 4px 12px; border-radius: 16px; corner-shape: squircle;
             box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .zl p.on { opacity: 1; transform: none; }
  .zl p.near { opacity: .4; }
  .zl.solo p.near { opacity: 0; }
  .saying .zl, .away .zl { opacity: 0; }
  .mascot-bulu.away .mb-bubble { visibility: hidden; }   /* off-screen while focusing: its lines show in the island */

  /* focus mode: current lyric line in a black pill at the top center, width follows the line */
  /* border-radius 1.2em = half the pill height (same look as 999px, but animates smoothly into the expanded card) */
  .zi { position: fixed; top: 8px; left: 50%; translate: -50% 0; width: 2.4em; max-width: 90vw; height: 2.4em; overflow: hidden; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; cursor: grab; touch-action: none; user-select: none;
        background: #000; color: #fff; border-radius: 1.2em; corner-shape: superellipse(1.4); box-shadow: 0 6px 20px rgba(0,0,0,.3); font: 600 var(--ls, 16px)/2.4em var(--sf);
        opacity: 0; scale: .5; --ez: cubic-bezier(.2,.9,.3,1.1);
        transition: width .5s var(--ez), height .5s var(--ez), border-radius .5s var(--ez), opacity .3s, scale .4s cubic-bezier(.3,1.5,.5,1); }
  .zi.on { opacity: 1; scale: 1; pointer-events: auto; }
  .zi.big { border-radius: 1.6em; }
  .zi > span { flex: none; }
  /* expanded: compact line fades out, card (timer | sessions + actions) fades in while the island grows */
  .zi > span { transition: opacity .2s; }
  .zi.big > span { position: absolute; opacity: 0; pointer-events: none; }
  .zi .ls { flex: none; width: max-content; padding: 1.1em; box-sizing: border-box; font-size: .8em; line-height: 1.4; cursor: default;
            opacity: 0; transform: translateY(.5em); transition: opacity .2s, transform .35s var(--ez); }
  .zi.big .ls { opacity: 1; transform: none; transition-delay: .12s, .1s; }
  .zi .ls .ex { display: grid; grid-template-columns: 8.5em auto; gap: 1.1em; }
  .zi .ls .tmr { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35em; padding-right: 1.1em; border-right: 1px solid #292929; }
  .zi .ls .ti { width: 3em; height: 3em; display: grid; place-items: center; border-radius: 50%; background: #073b20; color: #20e875; }
  .zi .ls .ti svg { width: 1.75em; height: 1.75em; margin: 0; }
  .zi .ls .tm { font-size: 1.9em; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .zi .ls small { color: #999; font-size: .85em; }
  .zi .ls .ss { display: flex; flex-direction: column; justify-content: center; gap: .4em; min-width: 16em; }
  /* two cards visible (card = 1.4em line + 1.2em padding), the rest scrolls with snap; fade hints there's more */
  .zi .ls .sl { display: flex; flex-direction: column; gap: .4em; max-height: 5.6em; overflow-y: auto; overscroll-behavior: contain;
                scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .zi .ls .sl.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 1.2em), transparent); }
  .zi .ls .sl p { flex: none; scroll-snap-align: start; }
  .zi .ls p { margin: 0; padding: .6em .85em; display: flex; justify-content: space-between; align-items: center; gap: 1.2em;
              background: #1a1a1a; color: rgba(255,255,255,.6); border-radius: .85em; corner-shape: squircle; }
  .zi .ls p span { font-size: .85em; padding: 0; }   /* undo the compact-line `.zi span` padding */
  .zi .ls p.cur { background: #242424; color: #fff; }
  .zi .ls p.done { opacity: .45; text-decoration: line-through; }
  .zi .ls .ac { display: flex; gap: .5em; margin-top: .1em; }
  .zi .ls button { height: 2.8em; padding: 0 1em; font: inherit; font-weight: 700; color: #fff; background: #242424;
                   border: 0; border-radius: .85em; corner-shape: squircle; cursor: pointer; transition: background .2s; }
  .zi .ls button[data-a=set] { flex: 1; }
  .zi .ls button[data-a=add] { width: 2.8em; padding: 0; display: grid; place-items: center; color: #20e875; }
  .zi .ls button svg { width: 1.3em; height: 1.3em; margin: 0; }
  .zi .ls button:hover:not(:disabled) { background: #363636; }
  .zi .ls button:disabled { opacity: .3; cursor: not-allowed; }
  .zp header { cursor: grab; touch-action: none; user-select: none; }
  .zp { max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; }
  #pSets label { gap: 8px; }
  #pSets label > span:last-child { gap: 5px; }
  #pSets input[type=number] { width: 46px; padding: 5px 6px; }
  #pSets .x { width: 24px; height: 24px; margin-left: 2px; }
  .zi span svg + svg { margin-left: .15em; }
  .zi span svg:last-of-type { margin-right: .4em; }

  /* note icons bounce (title bubble, instrumental breaks, island); three in a row ripple */
  .zn { animation: zn 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
  .zn:nth-child(2) { animation-delay: -.4s; } .zn:nth-child(3) { animation-delay: -.8s; }
  @keyframes zn { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-25%) rotate(10deg) scale(1.1); } }
  .zi span { display: inline-block; white-space: nowrap; padding: 0 1.1em; }
  .zi span.new { animation: zi-in .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes zi-in { from { opacity: 0; transform: translateY(70%) scale(.92); filter: blur(4px); } }
  .zi svg { width: 1em; height: 1em; vertical-align: -.15em; }

  /* speech bubble: squircle. Near a screen edge renderer.js slides it beside the head (the mascot itself never moves);
     the tail is an svg path computed from the bubble's size and where the head is, so it fits any text length or side */
  .mascot-bulu .mb-bubble { border-radius: 18px; corner-shape: squircle;
        transition: opacity .18s, transform .22s cubic-bezier(.3,1.6,.5,1), translate .45s cubic-bezier(.2,.8,.2,1); }
  .mascot-bulu .mb-bubble:after { display: none; }   /* mascot.js's fixed bottom triangle */
  .mascot-bulu .mb-bubble svg.tl { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; overflow: visible; pointer-events: none; }
  .mascot-bulu .mb-bubble svg.tl path { fill: #fff; transition: d .45s cubic-bezier(.2,.8,.2,1); }

  /* rage: body turns red (direct child svg only, so the glass and bubble icons keep their colors) */
  /* character: the same kind of filter recolours the blue fur (--char, set by renderer.js); a picked image (.img) replaces the body */
  .mascot-bulu > svg { transition: filter .8s; filter: var(--char, none); }
  .mascot-bulu:not(.img) .cimg, .mascot-bulu.img .body > :not(.cimg) { display: none; }
/* ears follow the mood (data-mood from mascot.js; while singing = the lyric's emotion). Angles are for the left ear,
   the right one is a mirrored copy, so negative = tips out and down */
.ear, .ear .tw { transform-box: fill-box; transform-origin: inherit; }
.ear { transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
[data-mood=happy] .ear { transform: rotate(5deg); }
[data-mood=love] .ear { transform: rotate(-12deg); animation: ear-wig 1.2s ease-in-out infinite; }
[data-mood=surprised] .ear { transform: rotate(8deg) scale(1.15); }
[data-mood=sad] .ear, [data-mood=sleepy] .ear { transform: rotate(-38deg) scale(.95); }
[data-mood=sleep] .ear, [data-mood=hurt] .ear { transform: rotate(-50deg) scale(.92); }
[data-mood=angry] .ear, [data-mood=sulky] .ear { transform: rotate(-62deg) scale(.85); }   /* flattened back */
[data-mood=dizzy] .ear { animation: ear-wig .5s ease-in-out infinite; }
[data-mood=fear] .ear { transform: rotate(-56deg) scale(.88); animation: ear-shiver .09s linear infinite; }   /* rata ke belakang, gemetar */
[data-mood=anxiety] .ear { transform: rotate(-18deg); animation: ear-wig .35s ease-in-out infinite; }   /* berkedut gelisah */
[data-mood=disgust] .ear { transform: rotate(-28deg) scale(.92); }
[data-mood=envy] .ear { transform: rotate(-24deg) scale(.95); }
[data-mood=ennui] .ear { transform: rotate(-46deg) scale(.95); }   /* layu */
[data-mood=embarrassed] .ear { transform: rotate(-32deg) scale(.9); }
@keyframes ear-shiver { 50% { translate: 1.5px 0; } }
[data-mood=ennui] .ears.beat .tw, [data-mood=fear] .ears.beat .tw { animation: none; }
.ears.beat .tw { animation: ear-tw .22s ease-out; }
[data-mood=sad] .ears.beat .tw, [data-mood=sleep] .ears.beat .tw { animation: none; }   /* sad = limp, no twitch */
@keyframes ear-tw { 40% { transform: rotate(9deg) scaleY(1.06); } }
/* Doodle character: fur, eye sockets and ears off; a hand-drawn white outline on a black face, small white dot eyes,
   white-outlined mouth and black gloves with white lines (mascot.js reads --hf / --hk) */
.mascot-bulu:not(.doodle) .dd { display: none; }
.doodle .f0, .doodle .f1, .doodle .f2, .doodle .fedge, .doodle .fimg, .doodle .sk, .doodle .ears { display: none; }
.doodle { --hf: #111116; --hk: #fff; }
.doodle .dd { fill: #111116; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.doodle .ddo { stroke: #111116; stroke-width: 13; }
.doodle .lt, .doodle .lb { fill: #111116; }
.doodle .ic { fill: #fff; }
.doodle .eye { transform-box: view-box; transform: scale(.34); }
.doodle .ar { stroke: #fff; }
.doodle .mo { fill: #111116; stroke: #fff; }
@keyframes ear-wig { 50% { transform: rotate(4deg); } }
  .mascot-bulu.red > svg { filter: hue-rotate(150deg) saturate(1.5) brightness(.95); }
  .mascot-bulu .mb-bubble .hi svg { display: inline; width: 13px; height: 13px; vertical-align: -2px; margin: 0 4px; color: #ff4d7d; }

  /* offered water glass (inside the mascot element, sized relative to it) */
  .zg { position: absolute; bottom: 16%; width: 28%; aspect-ratio: 60 / 80; cursor: pointer; filter: drop-shadow(0 4px 6px rgba(10,42,102,.25));
        animation: zg-in .5s cubic-bezier(.3,1.5,.5,1) both, zg-bob 2.2s ease-in-out .5s infinite; }
  .zg[hidden] { display: none; }
  .zg.l { right: 86%; --dir: 1; } .zg.r { left: 86%; --dir: -1; }
  @keyframes zg-in { from { opacity: 0; transform: translateX(calc(var(--dir) * 60%)) scale(.5) rotate(0); } }
  @keyframes zg-bob { 0%, 100% { transform: rotate(calc(var(--dir) * 6deg)) translateY(0); } 50% { transform: rotate(calc(var(--dir) * 2deg)) translateY(-6%); } }
  .zg .wv { animation: zg-wave 1.4s linear infinite; }
  @keyframes zg-wave { to { transform: translateX(-30px); } }
  .zg .lv { transition: transform .9s ease-in; }
  .zg.drink .lv { transform: translateY(54px); }
  .zg.drink { animation: zg-out .45s ease-in .85s forwards; }
  @keyframes zg-out { to { opacity: 0; transform: translateX(calc(var(--dir) * 50%)) scale(.6); } }

  /* ---------- panels ---------- */
  :root { --bg: #ffffff; --fg: #0f1b33; --mut: #6b7894; --line: #e5eaf2; --soft: #f2f5fa; --acc: #2f7fe0; --acc-fg: #fff; --track: #e3e9f3;
          --shadow: 0 1px 2px rgba(15,27,51,.06), 0 16px 40px rgba(15,27,51,.20); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161c27; --fg: #e8edf6; --mut: #8d99b0; --line: #273144; --soft: #1e2635; --acc: #5ba4ff; --acc-fg: #0b1220; --track: #2a3447;
            --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.5); }
  }
  .zp { position: fixed; z-index: 2147483647; width: 304px; padding: 18px; box-sizing: border-box;
        background: var(--bg); color: var(--fg); border: 1px solid var(--line); box-shadow: var(--shadow);
        border-radius: 36px; corner-shape: squircle;
        font: 13px/1.45 var(--sf); animation: zp-in .18s cubic-bezier(.2,.8,.2,1); }
  .zp[hidden] { display: none; }
  .zp.sm { width: 280px; }
  @keyframes zp-in { from { opacity: 0; transform: translateY(6px) scale(.97); } }
  .zp header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .zp h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; flex: 1; }
  .zp .ico { width: 28px; height: 28px; display: grid; place-items: center; background: var(--soft); border-radius: 11px; corner-shape: squircle; font-size: 15px; }
  .zp button { font: inherit; font-weight: 600; color: var(--fg); background: var(--soft); border: 0; cursor: pointer;
               border-radius: 14px; corner-shape: squircle; padding: 9px 14px; transition: filter .12s, transform .08s; }
  .zp button:hover { filter: brightness(.96); } .zp button:active { transform: scale(.97); }
  .zp button:focus-visible, .zp input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .zp button, .zp .ico { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .zp svg { width: 14px; height: 14px; flex: none; }
  .zp .ico svg { width: 15px; height: 15px; }
  .zp .x svg { width: 13px; height: 13px; }
  .zp .ico { color: var(--acc); }
  /* .mascot-bulu prefix: beats mascot.js's own `.mascot-bulu svg { width: 100% }` */
  .mascot-bulu .mb-bubble svg { display: inline; width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; color: #2f7fe0; }
  .mascot-bulu .zl span svg { display: inline; width: 13px; height: 13px; vertical-align: -2px; }
  .zp .x { width: 28px; height: 28px; padding: 0; border-radius: 50%; color: var(--mut); background: transparent; font-size: 14px; }
  .zp .x:hover { background: var(--soft); color: var(--fg); filter: none; }
  .zp .primary { background: var(--acc); color: var(--acc-fg); flex: 1; }
  .zp input[type=range] { flex: 1; accent-color: var(--acc); }
  .zp output { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--mut); font-weight: 600; }
  .zp .row { display: flex; align-items: center; gap: 12px; }

  .hero { display: flex; align-items: baseline; justify-content: space-between; }
  .hero b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero small { color: var(--mut); font-size: 13px; margin-left: 4px; }
  .pill { font-weight: 650; font-size: 12px; color: var(--acc); background: var(--soft); padding: 3px 9px; border-radius: 999px; }
  .bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5bb8ff, var(--acc)); border-radius: inherit; transition: width .4s cubic-bezier(.2,.8,.2,1); }
  .btns { display: flex; gap: 8px; }
  .btns .ghost { width: 46px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 74px; margin: 16px 0 4px; padding: 10px 10px 0;
          background: var(--soft); border-radius: 18px; corner-shape: squircle; }
  .week div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-height: 0; }
  .week i { width: 100%; max-width: 16px; background: color-mix(in srgb, var(--acc) 32%, var(--soft)); border-radius: 6px; transition: height .4s; }
  .week .today i { background: var(--acc); }
  .week span { font-size: 10.5px; color: var(--mut); padding-bottom: 6px; }
  .fields { margin-top: 12px; border-top: 1px solid var(--line); }
  .fields label { white-space: nowrap; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .fields label:last-child { border-bottom: 0; padding-bottom: 0; }
  .fields span { display: flex; align-items: center; gap: 6px; color: var(--mut); }
  .fields input[type=number], .fields input[type=time], .zp input[type=text] { font: inherit; font-weight: 600; color: var(--fg); background: var(--soft); border: 1px solid transparent;
        border-radius: 10px; corner-shape: squircle; padding: 5px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  .fields input[type=number] { width: 70px; }
  .fields input[type=time] { width: 64px; color-scheme: light dark; }
  .fields input::-webkit-calendar-picker-indicator, .fields input::-webkit-inner-spin-button { display: none; }
  .fields input:hover { border-color: var(--line); }
  .fields input[type=checkbox] { appearance: none; width: 38px; height: 22px; margin: 0; border-radius: 999px; background: var(--track); position: relative; cursor: pointer; transition: background .15s; }
  .fields input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .fields input[type=checkbox]:checked { background: var(--acc); }
  .fields input[type=checkbox]:checked::after { transform: translateX(16px); }

  /* chat with the AI + character picker */
  #pChat { width: 340px; }
  #cLog { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; margin-bottom: 10px; }
  #cLog p { margin: 0; padding: 7px 11px; max-width: 88%; align-self: flex-start; background: var(--soft); border-radius: 14px; corner-shape: squircle; white-space: pre-wrap; overflow-wrap: anywhere; }
  #cLog .me { align-self: flex-end; background: var(--acc); color: var(--acc-fg); }
  #cLog .err { color: #d6453d; }
  #cLog .ask { font: 12px/1.4 ui-monospace, Consolas, monospace; }
  #cLog .ask button { margin: 8px 6px 0 0; padding: 5px 12px; font-family: var(--sf); background: var(--bg); }
  #cForm { display: flex; gap: 8px; }
  #cIn { flex: 1; min-width: 0; padding: 9px 12px; text-align: left; }
  .zp select { font: inherit; font-weight: 600; color: var(--fg); background: var(--soft); border: 1px solid transparent; border-radius: 10px; corner-shape: squircle; padding: 5px 8px; width: 170px; color-scheme: light dark; }
  .zp input[type=password] { font: inherit; color: var(--fg); background: var(--soft); border: 1px solid transparent; border-radius: 10px; padding: 5px 8px; width: 130px; }
  #cStat { margin: 8px 0 0; color: var(--mut); font-size: 12px; white-space: pre-wrap; }
  #cStat:empty, .zp [hidden] { display: none !important; }   /* .fields label / .zp button set display, which beats [hidden] */
  #cPull { width: 120px; }
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chars button { flex-direction: column; padding: 10px 4px; }
  .chars i { width: 26px; height: 26px; border-radius: 50%; background: #3d93ee; }
  .chars .on { outline: 2px solid var(--acc); }
</style>
</head>
<body>
<section class="zp sm" id="pSize" hidden aria-label="Ukuran">
  <header><span class="ico" data-i="resize" aria-hidden="true"></span><h2>Ukuran</h2><button class="x" type="button" aria-label="Tutup" data-i="close"></button></header>
  <div class="row"><span style="width:44px;color:var(--mut)">Maskot</span><input type="range" id="rng" min="80" max="400" step="5" aria-label="Ukuran maskot"><output id="rngOut"></output></div>
  <div class="row" style="margin-top:10px"><span style="width:44px;color:var(--mut)">Lirik</span><input type="range" id="rngL" min="10" max="32" step="1" aria-label="Ukuran lirik"><output id="rngLOut"></output></div>
</section>

<section class="zp" id="pWater" hidden aria-label="Pengingat minum">
  <header><span class="ico" data-i="droplet" aria-hidden="true"></span><h2>Pengingat minum</h2><button class="x" type="button" aria-label="Tutup" data-i="close"></button></header>
  <div class="hero"><div><b id="wNow">0</b><small>/ <span id="wGoal">2.000</span> ml</small></div><span class="pill" id="wPct">0%</span></div>
  <div class="bar" role="presentation"><i id="wBar"></i></div>
  <div class="btns"><button class="ghost" id="wMinus" type="button" data-i="minus"></button><button class="primary" id="wPlus" type="button" data-i="plus"><span id="wPlusT">250 ml</span></button></div>
  <div class="week" id="wWeek" aria-label="7 hari terakhir"></div>
  <div class="fields">
    <label>Ukuran gelas <span><input type="number" id="fCup" min="50" max="2000" step="50"> ml</span></label>
    <label>Target harian <span><input type="number" id="fGoal" min="250" max="10000" step="250"> ml</span></label>
    <label>Ingatkan tiap <span><input type="number" id="fEvery" min="1" max="480" step="1"> mnt</span></label>
    <label>Jam aktif <span><input type="time" id="fFrom" aria-label="Mulai"> – <input type="time" id="fTo" aria-label="Selesai"></span></label>
    <label>Pengingat aktif <input type="checkbox" id="fOn" role="switch"></label>
  </div>
</section>
<section class="zp" id="pPomo" hidden aria-label="Pomodoro">
  <header><span class="ico" data-i="timer" aria-hidden="true"></span><h2>Pomodoro</h2><button class="x" type="button" aria-label="Tutup" data-i="close"></button></header>
  <div class="hero" aria-live="polite"><b id="pTime">25:00</b><span class="pill" id="pState">Siap</span></div>
  <div class="btns" style="margin-top:12px"><button class="primary" id="pGo" type="button"><span id="pGoT">Mulai fokus</span></button></div>
  <div class="fields" id="pSets" aria-label="Sesi (fokus / istirahat), maksimal 5"></div>
  <button id="pAdd" type="button" data-i="plus" style="width:100%;margin-top:10px">Tambah sesi</button>
</section>
<section class="zp" id="pChat" hidden aria-label="Ngobrol dengan ZIK">
  <header><span class="ico" data-i="heart" aria-hidden="true"></span><h2>ZIK</h2><button class="x" type="button" aria-label="Tutup" data-i="close"></button></header>
  <div id="cLog" aria-live="polite"></div>
  <form id="cForm"><input type="text" id="cIn" placeholder="Tulis pesan…" autocomplete="off" aria-label="Pesan"><button class="primary" style="flex:none">Kirim</button></form>
  <div class="fields">
    <label>Penyedia <select id="cProv" aria-label="Penyedia AI"></select></label>
    <label id="cKeyRow">API key <span><input type="password" id="cKey" spellcheck="false" placeholder="tempel di sini" autocomplete="off"><button class="x" type="button" id="cKeyGet" title="Ambil API key" aria-label="Ambil API key">↗</button></span></label>
    <label>Model <span><select id="cModel" aria-label="Model"></select><button class="x" type="button" id="cRefresh" title="Muat ulang daftar model" aria-label="Muat ulang daftar model">⟳</button></span></label>
    <div id="cSetup">
      <button type="button" id="cInstall" style="width:100%;margin:8px 0">Pasang &amp; jalankan Ollama</button>
      <label id="cPullRow">Unduh model <span><select id="cPull" aria-label="Model untuk diunduh"></select><button type="button" id="cPullGo">Unduh</button></span></label>
    </div>
    <p id="cStat" aria-live="polite"></p>
    <label>Jalankan perintah tanpa tanya <input type="checkbox" id="cAuto" role="switch"></label>
  </div>
</section>
<section class="zp sm" id="pChar" hidden aria-label="Karakter">
  <header><span class="ico" data-i="heart" aria-hidden="true"></span><h2>Karakter</h2><button class="x" type="button" aria-label="Tutup" data-i="close"></button></header>
  <div class="chars" id="chList"></div>
  <button id="chPick" type="button" style="width:100%;margin-top:10px">Pakai gambar sendiri…</button>
  <input type="file" id="chFile" accept="image/*" hidden>
</section>
<script src="mascot.js"></script>
<script src="lyrics.js"></script>
<script src="emotion.js"></script>
<script src="ai.js"></script>
<script src="zik.js"></script>
<script type="module" src="renderer.js"></script>
</body>
</html>
