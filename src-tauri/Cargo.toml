[package]
name = "zik"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
cpal = "0.16"

[profile.release]   # small binary
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
