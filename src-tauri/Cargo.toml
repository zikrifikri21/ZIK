[package]
name = "zik"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }   # HTTP to the AI model (Ollama / online APIs)
native-tls = "0.2"   # OS TLS stack (schannel on Windows), no bundled crypto

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_Graphics_Gdi"] }
cpal = "0.16"

[profile.release]   # small binary
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
